name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Changez pour 'master' si votre branche principale s'appelle master
  workflow_dispatch:

# Autorisations requises pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet un seul déploiement simultané
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install

      - name: Build de l'application
        run: npm run build -- --base=/Marcel-2.0/
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Dupliquer index.html vers 404.html (gestion SPA)
        run: cp dist/index.html dist/404.html

      - name: Upload de l'artefact pour GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
